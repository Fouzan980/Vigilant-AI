version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - command-center

  backend:
    build:
      context: ./mern/backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - REDIS_URL=redis://redis:6379
      - FIREBASE_PROJECT_ID=vigilant-ai-dev
    depends_on:
      - redis

  command-center:
    build:
      context: ./mern/command-center
    ports:
      - "5173:5173"

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  ai-model:
    build:
      context: ./ai-model
    ports:
      - "8000:8000"
