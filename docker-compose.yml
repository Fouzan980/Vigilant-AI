services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - command-center

  backend:
    build:
      context: ./mern/backend
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - PORT=3001
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  command-center:
    build:
      context: ./mern/command-center
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=/api/v1

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  ai-model:
    build:
      context: ./ai-model
    ports:
      - "8000:8000"
    env_file:
      - .env
