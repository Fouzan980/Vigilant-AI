name: vigilantai
description: "Vigilant AI - Community Safety Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
  dynamic_color: ^1.8.1
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  fl_chart: ^1.2.0

  # State Management & Routing
  flutter_riverpod: ^2.6.1
  go_router: ^17.2.3

  # Firebase
  firebase_core: ^4.8.0
  firebase_auth: ^6.5.0
  cloud_firestore: ^6.4.0

  # Google Services
  google_sign_in: ^7.2.0
  google_maps_flutter: ^2.17.0
  geolocator: ^14.0.2

  # Networking & Data
  dio: ^5.9.2
  shared_preferences: ^2.5.0
  flutter_dotenv: ^6.0.1

  # Device Features
  image_picker: ^1.2.2
  flutter_local_notifications: ^21.0.0
  url_launcher: ^6.3.2
  record: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
